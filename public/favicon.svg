<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="chispa-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#78350F" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#chispa-bg)" />
  
  <!-- Subtle ambient radial highlight -->
  <circle cx="256" cy="256" r="210" fill="url(#center-glow)" />

  <!-- Main Center Spark (Chispa) with Drop Shadow -->
  <g filter="url(#soft-shadow)">
    <!-- 4-pointed primary spark -->
    <path d="M 256 96 
             Q 256 220 220 256 
             Q 256 292 256 416 
             Q 256 292 292 256 
             Q 256 220 256 96 Z" 
          fill="#FFFDF5" />
    
    <path d="M 96 256 
             Q 220 256 256 220 
             Q 292 256 416 256 
             Q 292 256 256 292 
             Q 220 256 96 256 Z" 
          fill="#FFFDF5" />

    <!-- Center diamond core -->
    <polygon points="256,216 296,256 256,296 216,256" fill="#FEF3C7" />
  </g>

  <!-- Accent top-right micro-spark -->
  <g transform="translate(370, 140) scale(0.38)">
    <path d="M 0 -80 Q 0 -15 -20 0 Q 0 15 0 80 Q 0 15 20 0 Q 0 -15 0 -80 Z" fill="#FFFBEB" />
    <path d="M -80 0 Q -15 0 0 -20 Q 15 0 80 0 Q 15 0 0 20 Q -15 0 -80 0 Z" fill="#FFFBEB" />
  </g>

  <!-- Accent bottom-left tiny spark -->
  <g transform="translate(145, 365) scale(0.26)">
    <path d="M 0 -80 Q 0 -15 -20 0 Q 0 15 0 80 Q 0 15 20 0 Q 0 -15 0 -80 Z" fill="#FFFBEB" />
    <path d="M -80 0 Q -15 0 0 -20 Q 15 0 80 0 Q 15 0 0 20 Q -15 0 -80 0 Z" fill="#FFFBEB" />
  </g>

  <!-- Radiant ember dots -->
  <circle cx="395" cy="320" r="8" fill="#FEF08A" opacity="0.9" />
  <circle cx="120" cy="205" r="6" fill="#FEF08A" opacity="0.8" />
</svg>
